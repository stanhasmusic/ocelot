name: tests

# Runs the GUT unit suite headless on every push to main and every PR.
# Mirrors tools/run-tests.sh, which is the same command developers/Ralph run locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot 4.6.3 (no .NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false

      - name: Run GUT suite
        # run-tests.sh does the warm-up import (.godot/ is gitignored) then runs GUT.
        # Exit code 1 on any test failure fails the job.
        run: bash tools/run-tests.sh
